# What problem does this article solve? (1-2 sentences)
problem: "Edge fleets drift when the OS, Kubernetes, and site config each come from a different place, and nobody can say exactly what is running on a given node."

# What does the article build, test, compare, or argue? (1-2 sentences)
what_it_does: "Builds a Rocky Linux 10 bootc image with RKE2, serves every RPM, image, key and container pull from one Artifact Keeper registry, kickstarts it onto a node, signs everything so unsigned images are refused at build, install and upgrade, and runs a 7.8 MB day-2 upgrade and rollback."

# If readers remember one thing, what should it be? (1 sentence)
remember_one_thing: "Image mode bugs hide until the root filesystem is really read-only and the first upgrade finalizes, so boot and upgrade the image in CI, not just build it."

